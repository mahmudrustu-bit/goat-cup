name: Token Sağlık Kontrolü

# Instagram token'ı sessizce ölürse gönderiler durur ve bunu ancak
# bir gönderi kaçırdığınızda fark edersiniz. Bu iş haftada bir token'ı
# yoklar; geçersizse issue açar.

on:
  schedule:
    - cron: "0 7 * * 1" # her pazartesi 10:00 TRT
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Token'ı doğrula
        id: check
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          response=$(curl -sS -G \
            "https://graph.facebook.com/v26.0/${IG_USER_ID}" \
            --data-urlencode "fields=username,followers_count" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")

          echo "Yanıt: ${response}"

          if echo "${response}" | grep -q '"error"'; then
            {
              echo "message<<EOF"
              echo "${response}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sorun varsa issue aç
        if: steps.check.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          DETAIL: ${{ steps.check.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = "⚠️ Instagram token geçersiz — gönderiler duracak";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "otomasyon",
            });
            if (existing.data.some(i => i.title === title)) {
              core.info("Açık issue zaten var, yenisi oluşturulmadı.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["otomasyon"],
              body: [
                "Haftalık token kontrolü başarısız oldu. `IG_ACCESS_TOKEN` secret'ı",
                "büyük ihtimalle süresi dolmuş ya da iptal edilmiş.",
                "",
                "**Graph API yanıtı:**",
                "```json",
                process.env.DETAIL,
                "```",
                "",
                `[Çalıştırma kaydı](${process.env.RUN_URL})`,
                "",
                "Çözüm: `KURULUM.md` → *Token yenileme* bölümü.",
              ].join("\n"),
            });
